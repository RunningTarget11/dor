name: Build Android APK

# Builds an installable APK on every push to main (or when started by hand
# from the Actions tab) and publishes it as a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Set version and signing
        run: node scripts/ci-android-config.mjs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DOR-build-${{ github.run_number }}.apk
          # Same file under a fixed name, so the app's Update tab can always
          # link to .../releases/latest/download/DOR-latest.apk
          cp android/app/build/outputs/apk/release/app-release.apk DOR-latest.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DOR build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Manual build' }}
          files: |
            DOR-build-${{ github.run_number }}.apk
            DOR-latest.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: DOR-build-${{ github.run_number }}
          path: DOR-build-${{ github.run_number }}.apk
          retention-days: 14
